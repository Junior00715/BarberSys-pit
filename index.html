<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberSys - Agendamento de Barbearia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>💈 BarberSys</h1>
            <p>Sistema de Agendamento Online</p>
        </div>
    </header>

    <main class="container">
        <!-- ÁREA DE ALERTA DE FEEDBACK (IHC) -->
        <div id="mensagem-feedback" class="feedback oculto"></div>

        <!-- SEÇÃO: CATÁLOGO DE SERVIÇOS -->
        <section class="card">
            <h2>✂️ Nossos Serviços</h2>
            <div id="lista-servicos" class="grid-servicos"></div>
        </section>

        <!-- SEÇÃO: FORMULÁRIO DE AGENDAMENTO -->
        <section class="card">
            <h2>📅 Novo Agendamento</h2>
            <form id="form-agendamento">
                <div class="form-group">
                    <label for="nome-cliente">Nome do Cliente:</label>
                    <input type="text" id="nome-cliente" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="telefone-cliente">Telefone / WhatsApp:</label>
                    <input type="tel" id="telefone-cliente" placeholder="(11) 99999-9999" required>
                </div>

                <div class="form-group">
                    <label for="select-servico">Selecione o Serviço:</label>
                    <select id="select-servico" required>
                        <option value="">-- Escolha um serviço --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="data-agendamento">Data:</label>
                    <input type="date" id="data-agendamento" required>
                </div>

                <div class="form-group">
                    <label for="hora-agendamento">Horário:</label>
                    <input type="time" id="hora-agendamento" required>
                </div>

                <button type="submit" class="btn-primary">Confirmar Agendamento</button>
            </form>
        </section>

        <!-- SEÇÃO: PAINEL DE AGENDAMENTOS (GERENCIAMENTO) -->
        <section class="card">
            <h2>📋 Painel de Agendamentos Realizados</h2>
            <div class="tabela-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Telefone</th>
                            <th>Serviço</th>
                            <th>Data e Hora</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-agendamentos">
                        <!-- Inserido dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BarberSys - Projeto Integrador Transdisciplinar (PIT II)</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
